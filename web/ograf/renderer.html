<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OGraf renderer</title>
<!-- mxl-browser-source OGraf renderer (docs/ograf.md §3): 8 layers, one same-origin iframe each,
     layer 8 on top. The function calls window.ografRenderer.call() over DevTools Runtime.evaluate
     (awaitPromise) and keeps the layer state itself. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color-scheme: normal; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; visibility: hidden; color-scheme: normal; }
</style>
</head>
<body>
<script>
(() => {
  'use strict';
  const LAYERS = 8;
  const DISPOSE_MS = 2000;
  const layers = [];
  function newFrame(n) {
    const frame = document.createElement('iframe');
    frame.style.zIndex = String(n);
    frame.setAttribute('allow', 'autoplay');
    frame.setAttribute('aria-label', 'Layer ' + n);
    frame.src = 'about:blank';
    return frame;
  }
  for (let n = 1; n <= LAYERS; n++) {
    const frame = newFrame(n);
    document.body.appendChild(frame);
    layers[n] = { n, frame, ready: null, generation: 0, cancel: null };
  }

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // An OGraf ReturnPayload as plain JSON; undefined means { statusCode: 200 } (spec).
  function payload(result) {
    if (result === undefined || result === null) return { statusCode: 200 };
    const out = JSON.parse(JSON.stringify(result));
    if (typeof out !== 'object' || Array.isArray(out)) return { statusCode: 200, result: out };
    if (typeof out.statusCode !== 'number') out.statusCode = 200;
    return out;
  }

  function api(layer) {
    const win = layer.frame.contentWindow;
    return win && win.ografLayer;
  }

  // A new generation of the layer: a load still running for an older one is rejected at once
  // (its iframe is replaced, so its promises would otherwise never settle and the call would
  // hang until the function's action timeout).
  function supersede(layer) {
    layer.generation++;
    const cancel = layer.cancel;
    layer.cancel = null;
    if (cancel) cancel();
  }

  // Starts a load's generation; `superseded` rejects when the layer is loaded again or cleared.
  function claim(layer) {
    supersede(layer);
    const generation = layer.generation;
    let reject;
    const superseded = new Promise((_, r) => { reject = r; });
    superseded.catch(() => {}); // settles after the load did too: nobody waits for it then
    layer.cancel = () => reject(new Error('layer ' + layer.n + ' was loaded again or cleared meanwhile'));
    return { generation, superseded };
  }

  // A fresh layer document: its own globals, CSS, fonts and custom element registry.
  function freshDocument(layer, generation) {
    return new Promise((resolve) => {
      layer.frame.onload = () => { if (layer.generation === generation) resolve(); };
      layer.frame.src = '/renderer/layer.html?g=' + generation;
    });
  }

  async function dispose(layer) {
    const a = api(layer);
    if (a && a.element) {
      try {
        await Promise.race([a.dispose(), sleep(DISPOSE_MS)]);
      } catch (e) {
        console.warn('ograf: dispose() failed', e);
      }
    }
    layer.ready = null;
    supersede(layer);
    // A new iframe element instead of navigating the old one to about:blank: the old browsing
    // context, its documents, module map and GPU resources go with it (M5: the renderer kept
    // about 300 MB after all layers were cleared when the frames were only navigated away).
    const old = layer.frame;
    old.onload = null;
    layer.frame = newFrame(layer.n);
    old.replaceWith(layer.frame);
  }

  window.ografRenderer = Object.freeze({
    async call(n, method, args) {
      const layer = layers[n];
      if (!layer) throw new Error('no layer ' + n);
      if (method === 'load') {
        await dispose(layer);
        const { generation, superseded } = claim(layer);
        const loading = Promise.race([(async () => {
          await freshDocument(layer, generation);
          layer.frame.style.visibility = 'visible';
          return api(layer).load(args);
        })(), superseded]);
        layer.ready = loading.then(() => undefined, () => undefined); // actions wait for load() (spec)
        return payload(await loading);
      }
      if (method === 'dispose') {
        if (layer.ready) await layer.ready;
        await dispose(layer);
        return { statusCode: 200 };
      }
      if (!layer.ready) throw new Error('layer ' + n + ' is empty');
      await layer.ready;
      return payload(await api(layer).action(method, args));
    },
  });
})();
</script>
</body>
</html>
