<!doctype html>
<!-- Popups (SPEC §4.5, §17): a click calls window.open and follows a target=_blank link (both
     need a user gesture). With BROWSER_POPUPS=block neither opens and this page stays. -->
<html><head><meta charset="utf-8"><title>popup</title>
<style>
html,body{margin:0;height:100%;background:#103020;color:#fff;font:40px "DejaVu Sans",sans-serif;overflow:hidden}
#all{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;font:inherit;color:#fff}
</style></head>
<body>
<button id="all">popup</button>
<a id="blank" href="https://templates.local/blank.html?blank" target="_blank"></a>
<script>
const post = (o) => { if (window.mxlBrowserSource) window.mxlBrowserSource.post(o); };
document.getElementById("all").addEventListener("click", () => {
  const w = window.open("https://templates.local/blank.html?open", "_blank");
  document.getElementById("blank").click();
  post({popup: {window_open: w === null ? "null" : "window"}});
});
</script></body></html>
