<!doctype html>
<!-- A/V sync (SPEC §17): once per second a white flash and a 1 kHz burst (100 ms) start in the
     same requestAnimationFrame callback; the reader measures the offset between them in MXL. -->
<html><head><meta charset="utf-8"><title>avsync</title>
<style>html,body{margin:0;height:100%;background:#000}</style></head>
<body><script>
const ctx = new AudioContext({sampleRate: 48000});
let last = -1;
function burst() {
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = 1000; gain.gain.value = 0.5;
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.1);
}
function frame(t) {
  const second = Math.floor(t / 1000);
  if (second !== last) { last = second; document.body.style.background = "#fff"; burst(); }
  else document.body.style.background = "#000";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
