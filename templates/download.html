<!doctype html>
<!-- Downloads (SPEC §4.5, §17): a click follows an <a download> link to a small blob. The
     download is denied and counted; the page stays. -->
<html><head><meta charset="utf-8"><title>download</title>
<style>
html,body{margin:0;height:100%;background:#201030;color:#fff;font:40px "DejaVu Sans",sans-serif;overflow:hidden}
#all{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;font:inherit;color:#fff}
</style></head>
<body>
<button id="all">download</button>
<script>
const post = (o) => { if (window.mxlBrowserSource) window.mxlBrowserSource.post(o); };
document.getElementById("all").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["mxl-browser-source download test\n"], {type: "application/octet-stream"}));
  a.download = "download-test.bin";
  document.body.appendChild(a);
  a.click();
  post({download: "clicked"});
});
</script></body></html>
