<!doctype html>
<!-- A CasparCG-style lower third (SPEC §4.4): update(data) sets the text (a JSON string with
     name and title, f0/f1 like CasparCG, or plain text), play() slides it in, stop() out,
     next() toggles. play() reports through window.mxlBrowserSource.post. -->
<html><head><meta charset="utf-8"><title>lower third</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"DejaVu Sans",sans-serif}
#bar{position:absolute;left:120px;bottom:120px;padding:24px 48px;background:rgba(0,40,90,.9);color:#fff;
     border-left:12px solid #ffb000;transform:translateX(-140%);transition:transform .5s ease}
#bar.on{transform:translateX(0)}
#name{font-size:56px;font-weight:bold}#title{font-size:36px;opacity:.9}
</style></head>
<body><div id="bar"><div id="name">Name</div><div id="title">Title</div></div>
<script>
function update(data) {
  let d;
  try { d = JSON.parse(data); } catch (e) { d = {name: String(data), title: ""}; }
  document.getElementById("name").textContent = d.name ?? d.f0 ?? "";
  document.getElementById("title").textContent = d.title ?? d.f1 ?? "";
}
function play() {
  document.getElementById("bar").classList.add("on");
  if (window.mxlBrowserSource) window.mxlBrowserSource.post({played: true});
}
function stop() { document.getElementById("bar").classList.remove("on"); }
function next() { document.getElementById("bar").classList.toggle("on"); }
</script></body></html>
