name: Container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A release never moves a tag that exists already (SPEC §15.4).
      - name: Refuse an existing release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if docker manifest inspect "${REGISTRY}/${IMAGE_NAME,,}:${version}" >/dev/null 2>&1; then
            echo "image tag ${version} exists; tags are never moved" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=nightly-dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=git-,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mxl-browser-source
            org.opencontainers.image.description=MXL media function: a web page rendered offscreen with CEF
            org.opencontainers.image.source=https://github.com/LeeO86/mxl-browser-source
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.dmf.mxl.revision=218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
